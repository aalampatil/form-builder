<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="title description">
  <title id="title">Sumikami brand palette</title>
  <desc id="description">Six labeled brand colors: Sumi Black #171714, Washi Ivory #F5F0E6, Hanko Red #B74436, Stone Gray #8A877F, Mist White #FCFAF6, and Digital Sage #9DAF9F.</desc>
  <rect width="960" height="380" rx="8" fill="#F5F0E6"/>
  <g font-family="system-ui, sans-serif" fill="#171714">
    <text x="28" y="38" font-size="24" font-weight="600">Sumikami</text>
    <text x="28" y="64" font-size="16">Make every question an experience.</text>
    <g stroke="#8A877F" stroke-width="1">
      <rect x="28" y="88" width="280" height="76" rx="4" fill="#171714"/>
      <rect x="340" y="88" width="280" height="76" rx="4" fill="#F5F0E6"/>
      <rect x="652" y="88" width="280" height="76" rx="4" fill="#B74436"/>
      <rect x="28" y="232" width="280" height="76" rx="4" fill="#8A877F"/>
      <rect x="340" y="232" width="280" height="76" rx="4" fill="#FCFAF6"/>
      <rect x="652" y="232" width="280" height="76" rx="4" fill="#9DAF9F"/>
    </g>
    <g font-size="16" font-weight="500">
      <text x="28" y="190">Sumi Black</text>
      <text x="340" y="190">Washi Ivory</text>
      <text x="652" y="190">Hanko Red</text>
      <text x="28" y="334">Stone Gray</text>
      <text x="340" y="334">Mist White</text>
      <text x="652" y="334">Digital Sage</text>
    </g>
    <g font-family="monospace" font-size="14">
      <text x="28" y="212">#171714</text>
      <text x="340" y="212">#F5F0E6</text>
      <text x="652" y="212">#B74436</text>
      <text x="28" y="356">#8A877F</text>
      <text x="340" y="356">#FCFAF6</text>
      <text x="652" y="356">#9DAF9F</text>
    </g>
  </g>
</svg>
